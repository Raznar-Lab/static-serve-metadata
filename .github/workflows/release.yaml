name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v3

      - name: Create release branch
        env:
          REF: ${{ github.ref }}
        run: |
          BRANCH=release/${REF:10}
          git config --local user.email "ci@raznar.id"
          git config --local user.name "Raznar CI"
          git checkout -b $BRANCH
          git push -u origin $BRANCH

      - name: Create release archive
        run: |
          tar -czf serve-static-metadata.tar.gz * .github .gitignore .dockerignore

      - name: Create release builds
        run: |
          make build-all-prod

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

      - name: Upload release files
        run: |
          gh release upload "${REF:10}" \
            serve-static-metadata.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          for file in build/*; do
            echo "Uploading $file"
            gh release upload "${REF:10}" "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done
        env:
          REF: ${{ github.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
